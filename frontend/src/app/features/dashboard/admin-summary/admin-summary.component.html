<app-kpi-card
  title="Administrador"
  icon="admin"
  [metrics]="[
    { label: 'Reportes abiertos', value: data()?.['open_incidents'], icon: 'incident' },
    {
      label: 'Manuscritos esperando revisores',
      value: data()?.['awaiting_reviewers'],
      icon: 'hourglass',
    },
  ]"
>
  <a class="btn btn--ghost" routerLink="/app/admin/incidents">Incidentes</a>
  <a class="btn btn--subtle" routerLink="/app/admin/reviewers">Revisores</a>
  <a class="btn btn--subtle" routerLink="/app/admin/areas">Carreras</a>
  <a class="btn btn--subtle" routerLink="/app/admin/audit">Auditoría</a>
</app-kpi-card>
